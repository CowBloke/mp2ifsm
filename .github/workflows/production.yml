name: Validate and approve production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mp2ifsm-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ci-build-only-not-a-production-secret
      CRON_TOKEN: ci-build-only
      PUBLIC_ORIGIN: https://mp2ifsm.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  approve:
    name: Approve for production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://mp2ifsm.com
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark this exact commit as approved
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # production must only ever move forward. Approving an older run
          # after a newer one has shipped would otherwise rewind the branch,
          # and the deploy host would treat that rollback as a new release.
          if git fetch --quiet origin '+refs/heads/production:refs/remotes/origin/production' 2>/dev/null; then
            current=$(git rev-parse refs/remotes/origin/production)
            if [ "$current" = "$APPROVED_SHA" ]; then
              echo "production is already at $APPROVED_SHA"
              exit 0
            fi
            if git merge-base --is-ancestor "$APPROVED_SHA" "$current"; then
              echo "refusing to rewind production from $current to $APPROVED_SHA" >&2
              exit 1
            fi
          fi

          git push origin "$APPROVED_SHA:refs/heads/production"
