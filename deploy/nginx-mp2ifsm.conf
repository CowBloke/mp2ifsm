# mp2ifsm.com — portail de classe.
#
# Routage : Cloudflare (TLS + DNS proxifié) -> tunnel cowtunnel ->
# http://localhost:80 -> ce vhost (choisi par server_name) ->
# application Next.js sur 127.0.0.1:4260.
#
# Le Pi héberge plusieurs domaines derrière le MÊME tunnel : c'est
# server_name qui les sépare ici, et la règle d'ingress qui les sépare
# côté Cloudflare. Ne pas ajouter de default_server sur ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name mp2ifsm.com www.mp2ifsm.com;

    # Cloudflare termine le TLS ; l'origine reste en clair sur loopback.
    # On sert bien sur le port 80 (pas de redirection vers 443), sinon
    # le tunnel part en boucle de redirection.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), browsing-topics=()" always;

    # script-src 'unsafe-inline' : scripts d'hydratation Next.js (et
    # l'injection Cloudflare JS Detections). style-src autorise
    # cowbloke.com, d'où viennent les jetons tweakcn partagés.
    # connect-src nomme le WebSocket du jeu (/ws/jeu) ; certains
    # Safari ne l'acceptent pas au seul titre de 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cowbloke.com; font-src 'self' data:; img-src 'self' data:; connect-src 'self' wss://mp2ifsm.com wss://www.mp2ifsm.com; object-src 'none'; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;

    # Pas de Cache-Control ici : Next.js envoie déjà "no-store" sur les
    # routes dynamiques et "immutable" sur les assets hachés. Un
    # add_header dupliquerait l'en-tête au lieu de le remplacer.

    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:4260;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare a déjà fait le HTTPS : l'app doit générer des URL https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 120s;
        proxy_buffering    on;
    }

    # Jeu : WebSocket vers le serveur de jeu (mp2ifsm-jeu.service). Le
    # serveur vérifie lui-même l'origine et le ticket signé par le site.
    location = /ws/jeu {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Une partie peut durer ; le serveur envoie de toute façon un
        # ping chaque seconde.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }

    # Santé du serveur de jeu : pour la machine seulement. Le tunnel
    # Cloudflare arrive lui aussi de 127.0.0.1 : on écarte donc en plus
    # toute requête qui porte l'en-tête ajouté par Cloudflare.
    location = /ws/jeu/sante {
        if ($http_cf_connecting_ip) { return 403; }
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4270;
    }

    # Le tirage des dépôts est déclenché par le cron local uniquement.
    location /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4260;
        proxy_set_header Host $host;
    }
}
